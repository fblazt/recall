name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: ${{ steps.release.outputs.release_created }}
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        if: ${{ steps.release.outputs.release_created }}
        run: ./gradlew testDebugUnitTest

      - name: Decode Release Keystore
        if: ${{ steps.release.outputs.release_created }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "${{ runner.temp }}/keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/keystore/release.keystore"

      - name: Build Release APK
        if: ${{ steps.release.outputs.release_created }}
        env:
          KEYSTORE_FILE: "${{ runner.temp }}/keystore/release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PVERSION_NAME="${{ steps.release.outputs.version }}" \
            -PVERSION_CODE="${{ github.run_number }}"

      - name: Clean Keystore
        if: always() && steps.release.outputs.release_created
        run: rm -rf "${{ runner.temp }}/keystore"

      - name: Upload APK to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.release.outputs.tag_name }}"
          VERSION="${{ steps.release.outputs.version }}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="app/build/outputs/apk/release/notification-history-v${VERSION}.apk"
          mv "$APK_SRC" "$APK_DEST"
          gh release upload "$TAG_NAME" "$APK_DEST" --clobber
